<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粵語詞彙自學工具</title>
    <meta name="referrer" content="no-referrer">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f4f7f9; }
        
        .writing-container {
            width: 340px; 
            height: 340px; 
            position: relative;
            background-color: #fff;
            border: 3px dashed #d1d5db;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            cursor: crosshair;
        }

        .char-tab {
            width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            border: 2px solid #e5e7eb; background-color: white; color: #374151;
        }
        .char-tab.active {
            background-color: #3b82f6; color: white;
            border-color: #2563eb; transform: scale(1.1);
        }

        #score-display {
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
            min-height: 28px;
            font-size: 1.1rem;
        }
        .score-good { color: #10b981; } 
        .score-ok { color: #f59e0b; }
        .score-bad { color: #ef4444; } 
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <div id="app" class="w-full max-w-4xl bg-white shadow-2xl rounded-xl p-6 md:p-10 relative z-10">
        <h1 id="header-title" class="text-3xl font-bold text-gray-800 text-center mb-6">粵語詞彙發音系統</h1>
        
<div id="breadcrumb" class="text-sm text-gray-500 mb-6 flex space-x-2 items-center">
            <span class="cursor-pointer hover:text-blue-600 transition duration-150" onclick="renderHome()">主頁</span>
            <span id="breadcrumb-book" class="hidden">/ <span class="font-medium text-gray-600 transition duration-150"></span></span>
            <span id="breadcrumb-lesson" class="hidden">/ <span class="font-medium text-gray-800 transition duration-150"></span></span>
        </div>

<div class="mb-6">
            <button onclick="openQuizSetup()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl shadow-md font-bold text-sm transition-all transform active:scale-95 flex items-center gap-2">
                ⚙️ 自訂範圍並生成測驗
            </button>
        </div>

        <div id="quiz-setup-container" class="hidden mb-6 p-6 bg-white border border-indigo-200 rounded-2xl shadow-sm">
            <h2 class="text-xl font-bold text-indigo-900 mb-4 flex items-center gap-2">📚 請選擇你要溫習的課目</h2>
            <p class="text-sm text-gray-500 mb-4">您可以同時勾選多個課目，系統將從您選擇的範圍內隨機抽取 20 題。</p>
            
            <div id="quiz-scope-list" class="space-y-4 mb-6 max-h-64 overflow-y-auto p-4 border border-gray-100 rounded-xl bg-gray-50">
                </div>
            
            <div class="flex gap-3">
                <button onclick="startCustomQuiz()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2.5 rounded-lg font-bold shadow transition-all flex items-center gap-2">
                    🚀 開始測驗
                </button>
                <button onclick="document.getElementById('quiz-setup-container').classList.add('hidden')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2.5 rounded-lg font-bold transition-all">
                    取消
                </button>
            </div>
        </div>

        <div id="quiz-container" class="hidden mb-6 p-6 bg-indigo-50 border border-indigo-100 rounded-2xl shadow-sm">
            <div class="flex justify-between items-center mb-4 border-b border-indigo-200 pb-3">
                <h2 class="text-2xl font-bold text-indigo-900 flex items-center gap-2">📝 詞彙隨機挑戰賽</h2>
                <span id="quiz-score" class="bg-indigo-200 text-indigo-800 font-bold px-3 py-1 rounded-full text-sm">得分：0 / 20</span>
            </div>
            <div id="quiz-content" class="space-y-6"></div>
        </div>

        <div id="browser-tts-info" class="p-3 bg-blue-100 text-blue-700 rounded-lg border border-blue-400 mt-2 mb-6 text-sm">

        </div>
        
        <div id="content"></div>
    </div>

    <div id="writing-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden z-50 flex items-center justify-center p-2">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-4 flex flex-col items-center relative">
            <div class="w-full flex justify-between items-center mb-2 border-b pb-2">
                <h3 class="text-xl font-bold text-gray-700">寫字練習</h3>
                <button onclick="closeWritingModal()" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            
            <div id="char-tabs-container" class="flex space-x-2 mb-2 overflow-x-auto py-2 w-full justify-center"></div>
            
            <div class="writing-container relative">
                <div id="hanzi-target" class="absolute inset-0 z-0 pointer-events-none"></div>
                <canvas id="writing-canvas" width="340" height="340" class="absolute inset-0 z-10"></canvas>
            </div>

            <div id="score-display" class="text-gray-500">請在灰色字上描寫...</div>

            <div class="grid grid-cols-2 gap-3 mt-4 w-full">
                <button onclick="checkSimilarity()" class="py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-lg shadow transition flex justify-center items-center">
                    💯 檢查評分
                </button>
                <button onclick="animateChar()" class="py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg shadow transition flex justify-center items-center">
                    👀 觀看寫法
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-2 w-full">
                <button onclick="clearCanvas()" class="py-2 bg-yellow-400 hover:bg-yellow-500 text-white font-bold rounded-lg shadow transition">
                    🧹 清除
                </button>
                <button onclick="closeWritingModal()" class="py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-lg transition">
                    關閉
                </button>
            </div>

            <button id="next-char-btn" onclick="nextChar()" class="mt-3 w-full py-2 bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold rounded-lg transition hidden">
                下一個字 ➡
            </button>
        </div>
    </div>

    <canvas id="target-canvas" width="340" height="340" class="hidden"></canvas>

    <div id="definition-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden z-50 flex items-center justify-center p-4">

            <div class="border-b pb-3 mb-4 flex justify-between items-start">

    // 評分演算法 
    window.checkSimilarity = function() {
        const studentData = ctx.getImageData(0, 0, 340, 340).data;
        const targetData = targetCtx.getImageData(0, 0, 340, 340).data;
        
        let targetPixels = 0;
        let overlapPixels = 0;
        let errorPixels = 0;

        for (let i = 0; i < targetData.length; i += 4) {
            const isTargetInk = targetData[i + 3] > 100;
            const isStudentInk = studentData[i + 3] > 100;

            if (isTargetInk) {
                targetPixels++;
                if (isStudentInk) overlapPixels++;
            } else {
                if (isStudentInk) errorPixels++;
            }
        }

        if (targetPixels === 0) return;

        // 原始覆蓋率
        const rawCoverage = overlapPixels / targetPixels;
        
        // 關鍵修改：分數倍增器 (Difficulty Multiplier)
        const difficultyMultiplier = 2; 
        
        // 計算基礎分
        let score = (rawCoverage * difficultyMultiplier) * 100;
        
        // 扣分機制
        const penalty = (errorPixels / targetPixels) * 10;
        
        score = score - penalty;

        if (score > 100) score = 100;
        if (score < 0) score = 0;
        
        displayScore(Math.round(score));
    }

    function displayScore(score) {
        if (score >= 80) {

            scoreDisplay.innerHTML = `✅ <span class="score-good">及格！相似度 ${score}%</span> (很好)`;
        } else if (score >= 10) {
            scoreDisplay.innerHTML = `💪 <span class="score-ok">相似度 ${score}%</span> (再多寫一點)`;
        } else {
            scoreDisplay.innerHTML = `<span class="score-bad">請試著填滿灰色區域</span>`;
        }
    }

        let html = '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">';
        Object.keys(localVocabBank).forEach(bookId => {
            const book = localVocabBank[bookId];
            html += `<button onclick="selectBook(${bookId})" class="p-6 bg-emerald-500 text-white font-semibold text-lg rounded-lg shadow-md hover:bg-emerald-600 transition duration-150 transform hover:scale-105">${book.title}</button>`;
        });
        html += '</div>'; contentDiv.innerHTML = html;
    }

    function renderBook() {
        selectedBankType = 'ncs';
        window.learningMaterial = existingVocabBank;
        const book = learningMaterial[selectedBook];
        if (!book) {
            renderNcsBank();
            return;
        }
        headerTitle.textContent = `${book.title} - 選擇課堂`;
        breadcrumbBook.querySelector('span').textContent = book.title;
        breadcrumbBook.classList.remove('hidden'); breadcrumbLesson.classList.add('hidden');
        let html = '<div class="grid grid-cols-2 md:grid-cols-5 gap-4">';
        book.lessons.forEach(lesson => {
            html += `<button onclick="selectLesson(${lesson.id})" class="p-4 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 transition duration-150">${lesson.title}</button>`;
        });
        html += '</div>'; contentDiv.innerHTML = html;
    }
    function renderLesson() {
        const book = learningMaterial[selectedBook];
        const lesson = book.lessons.find(l => l.id === selectedLesson);
        headerTitle.textContent = `${book.title} - ${lesson.title}`;
        breadcrumbLesson.querySelector('span').textContent = lesson.title;
        breadcrumbLesson.classList.remove('hidden');
        let html = `<div class="mb-6 flex justify-start"><button onclick="renderBook()" class="flex items-center space-x-2 px-4 py-2 bg-yellow-500 text-white font-semibold rounded-lg shadow-md hover:bg-yellow-600 transition duration-150"><span>⬅ 返回課堂列表</span></button></div><div class="space-y-4">`;
        lesson.words.forEach((item) => {
            html += `<div class="p-4 bg-gray-100 rounded-lg shadow-inner border-l-4 border-red-500 flex flex-col md:flex-row justify-between items-center hover:bg-yellow-50 transition duration-150 gap-4"><div class="flex-1 text-center md:text-left"><div class="text-3xl font-bold text-gray-800">${item.text}</div><div class="text-sm text-gray-500 mt-1">${item.jyutping}</div></div><div class="flex space-x-2"><button onclick="handlePronunciationRequest('${item.text}', '${item.jyutping}', '${item.speakText || ''}')" class="bg-red-500 text-white px-3 py-2 rounded-lg shadow hover:bg-red-600 active:scale-95 transition flex items-center text-sm font-medium">🔊 <span class="hidden md:inline ml-1">播放</span></button><button onclick="openWritingModal('${item.text}')" class="bg-blue-500 text-white px-3 py-2 rounded-lg shadow hover:bg-blue-600 active:scale-95 transition flex items-center text-sm font-medium">📝 <span class="hidden md:inline ml-1">寫字</span></button><button onclick="openDefinitionModal('${item.text}', '${item.jyutping}', '${item.meaningZH || ''}', '${item.meaningEN ? item.meaningEN.replace(/'/g, "\\'") : ''}')" class="bg-green-500 text-white px-3 py-2 rounded-lg shadow hover:bg-green-600 active:scale-95 transition flex items-center text-sm font-medium">📖 <span class="hidden md:inline ml-1">解釋</span></button></div></div>`;
        });
        html += '</div>'; contentDiv.innerHTML = html;
    }
    function selectBank(bankType) {
        if (bankType === 'local') {
            renderLocalBank();
            return;
        }
        renderNcsBank();
    }
    window.selectBook = (id) => { selectedBook = id; renderBook(); };
    window.selectLesson = (id) => { selectedLesson = id; renderLesson(); };
    window.selectBank = selectBank;
    window.renderHome = renderHome; window.renderBook = renderBook;
    window.selectChar = selectChar; window.nextChar = nextChar; 
    window.learningMaterial = learningMaterial;
    window.checkSimilarity = checkSimilarity; window.animateChar = animateChar;
    window.openDefinitionModal = openDefinitionModal; window.showEnglishDefinition = showEnglishDefinition; window.closeDefinitionModal = closeDefinitionModal;
    window.onload = renderHome;

</script>
<script>
    let quizQuestions = [];
    let correctCount = 0;
    let answeredQuestionsCount = 0; 
    let detectedBooks = []; // 用於存放標準化後的冊課與單字結構

    // 核心功能：深度雷達掃描解析器
    function parseLearningMaterial() {
        detectedBooks = [];
        const mat = window.learningMaterial;
        if (!mat) return;

        // 輔助函式：遞迴提取某區塊內的所有合法單字物件
        function extractWords(obj) {
            let list = [];
            function scan(o) {
                if (!o || typeof o !== 'object') return;
                if (o.text && (o.meaningZH || o.meaningEN)) {
                    list.push(o);
                    return;
                }
                if (Array.isArray(o)) {
                    o.forEach(item => scan(item));
                    return;
                }
                for (const k in o) {
                    if (o.hasOwnProperty(k) && k !== 'title' && k !== 'name' && k !== 'id') {
                        scan(o[k]);
                    }
                }
            }
            scan(obj);
            return list;
        }

        // 核心處理：分析單一冊物件並拆解課目
        function processBook(bookKey, bookObj) {
            let bookTitle = bookKey;
            let rawLessons = null;

            if (bookObj && typeof bookObj === 'object') {
                if (bookObj.title || bookObj.name) {
                    bookTitle = bookObj.title || bookObj.name;
                }
                if (bookObj.lessons) rawLessons = bookObj.lessons;
                else if (bookObj.lessonsList) rawLessons = bookObj.lessonsList;
                else if (bookObj.list) rawLessons = bookObj.list;
            }

            let lessonsList = [];

            if (rawLessons && typeof rawLessons === 'object') {
                if (Array.isArray(rawLessons)) {
                    rawLessons.forEach((lessonObj, lIdx) => {
                        let lessonTitle = (lessonObj && (lessonObj.title || lessonObj.name)) || `第 ${lIdx + 1} 課`;
                        let words = extractWords(lessonObj);
                        if (words.length > 0) {
                            lessonsList.push({ title: lessonTitle, words: words });
                        }
                    });
                } else {
                    for (let lessonKey in rawLessons) {
                        if (!rawLessons.hasOwnProperty(lessonKey)) continue;
                        let lessonObj = rawLessons[lessonKey];
                        let lessonTitle = lessonKey;
                        if (lessonObj && typeof lessonObj === 'object' && (lessonObj.title || lessonObj.name)) {
                            lessonTitle = lessonObj.title || lessonObj.name;
                        }
                        let words = extractWords(lessonObj);
                        if (words.length > 0) {
                            lessonsList.push({ title: lessonTitle, words: words });
                        }
                    }
                }
            } 
            else if (Array.isArray(bookObj)) {
                bookObj.forEach((lessonObj, lIdx) => {
                    let lessonTitle = (lessonObj && (lessonObj.title || lessonObj.name)) || `第 ${lIdx + 1} 課`;
                    let words = extractWords(lessonObj);
                    if (words.length > 0) {
                        lessonsList.push({ title: lessonTitle, words: words });
                    }
                });
            }
            else if (bookObj && typeof bookObj === 'object') {
                for (let lessonKey in bookObj) {
                    if (!bookObj.hasOwnProperty(lessonKey)) continue;
                    if (lessonKey === 'title' || lessonKey === 'name' || lessonKey === 'id' || lessonKey === 'lessons') continue;
                    
                    let lessonObj = bookObj[lessonKey];
                    let lessonTitle = lessonKey;
                    if (lessonObj && typeof lessonObj === 'object' && (lessonObj.title || lessonObj.name)) {
                        lessonTitle = lessonObj.title || lessonObj.name;
                    }
                    let words = extractWords(lessonObj);
                    if (words.length > 0) {
                        lessonsList.push({ title: lessonTitle, words: words });
                    }
                }
            }

            if (lessonsList.length > 0) {
                detectedBooks.push({ title: bookTitle, lessons: lessonsList });
            }
        }

        if (Array.isArray(mat)) {
            mat.forEach((item, index) => {
                if (item && typeof item === 'object') {
                    let bKey = item.title || item.name || `第 ${index + 1} 冊`;
                    processBook(bKey, item);
                }
            });
        } else if (typeof mat === 'object' && mat !== null) {
            if (mat.books) {
                if (Array.isArray(mat.books)) {
                    mat.books.forEach((b, i) => processBook(b.title || b.name || `第 ${i + 1} 冊`, b));
                } else if (typeof mat.books === 'object') {
                    for (let k in mat.books) {
                        if (mat.books.hasOwnProperty(k)) processBook(k, mat.books[k]);
                    }
                }
            } else {
                for (let bookKey in mat) {
                    if (mat.hasOwnProperty(bookKey)) {
                        processBook(bookKey, mat[bookKey]);
                    }
                }
            }
        }
    }

    // 1. 開啟並渲染「選擇課目」面板
    window.openQuizSetup = function() {
        const setupContainer = document.getElementById('quiz-setup-container');
        const scopeList = document.getElementById('quiz-scope-list');
        const quizContainer = document.getElementById('quiz-container');
        
        quizContainer.classList.add('hidden'); 
        setupContainer.classList.remove('hidden'); 

        if (typeof window.learningMaterial === 'undefined') {
            scopeList.innerHTML = '<p class="text-red-500 font-bold">錯誤：讀取不到字詞庫！</p>';
            return;
        }

        parseLearningMaterial();

        if (detectedBooks.length === 0) {
            scopeList.innerHTML = '<p class="text-red-500 font-bold">⚠️ 無法抽取到有效的單字與課目。</p>';
            return;
        }

        let html = '';
        detectedBooks.forEach((book, bIdx) => {
            html += `<div class="mb-4"><h3 class="font-bold text-indigo-800 border-b-2 border-indigo-100 pb-1 mb-3 flex items-center gap-2">📘 ${book.title}</h3><div class="flex flex-wrap gap-3">`;
            
            book.lessons.forEach((lesson, lIdx) => {
                const pathId = `${bIdx}|||${lIdx}`;
                html += `
                <label class="flex items-center space-x-2 cursor-pointer bg-white px-3 py-2 rounded-lg border border-gray-200 hover:bg-indigo-50 hover:border-indigo-300 transition-all shadow-sm">
                    <input type="checkbox" class="quiz-scope-checkbox form-checkbox h-4 w-4 text-indigo-600 rounded" value="${pathId}">
                    <span class="text-sm font-medium text-gray-700">${lesson.title}</span>
                </label>`;
            });
            html += `</div></div>`;
        });
        scopeList.innerHTML = html;
    };

    // 2. 根據勾選的範圍開始測驗 (調降為最高 10 題)
    window.startCustomQuiz = function() {
        const checkboxes = document.querySelectorAll('.quiz-scope-checkbox:checked');
        const selectedScopes = Array.from(checkboxes).map(cb => cb.value);

        if (selectedScopes.length === 0) {
            alert("⚠️ 請至少勾選一個課目來進行溫習！");
            return;
        }

        let allWords = [];
        selectedScopes.forEach(scope => {
            const parts = scope.split('|||');
            const bIdx = parseInt(parts[0]);
            const lIdx = parseInt(parts[1]);
            
            if (detectedBooks[bIdx] && detectedBooks[bIdx].lessons[lIdx]) {
                const lesson = detectedBooks[bIdx].lessons[lIdx];
                const bookTitle = detectedBooks[bIdx].title;
                
                lesson.words.forEach(w => {
                    allWords.push({
                        ...w,
                        sourceBook: bookTitle,
                        sourceLesson: lesson.title
                    });
                });
            }
        });

        if (allWords.length < 4) {
            alert(`⚠️ 您勾選的範圍內單字數量太少（僅 ${allWords.length} 個），無法生成四選一題目！`);
            return;
        }

        document.getElementById('quiz-setup-container').classList.add('hidden');
        correctCount = 0;
        answeredQuestionsCount = 0;
        quizQuestions = [];

        // 混合打亂並隨機挑選最多 10 題 (已修正為 10)
        const shuffledWords = [...allWords].sort(() => 0.5 - Math.random());
        const totalQuestionsCount = Math.min(10, shuffledWords.length);
        const targetWords = shuffledWords.slice(0, totalQuestionsCount);
        
        document.getElementById('quiz-score').innerText = `得分：0 / ${totalQuestionsCount}`;

        targetWords.forEach((target, index) => {
            const wrongCandidates = allWords.filter(w => w.text !== target.text);
            const shuffledWrong = wrongCandidates.sort(() => 0.5 - Math.random());
            const wrongChoices = shuffledWrong.slice(0, 3);
            const optionsPool = [target, ...wrongChoices].sort(() => 0.5 - Math.random());
            const correctAnswerIndex = optionsPool.findIndex(o => o.text === target.text);
            
            // 隨機決定題型：true 為看字選義，false 為看義選字
            const isQuestionTypeText = Math.random() > 0.5;

            let questionText = isQuestionTypeText 
                ? `請選出「<span class="text-indigo-600 font-bold">${target.text}</span>」${target.jyutping ? `(${target.jyutping})` : ''} 的正確中文意思：`
                : `以下哪一個字詞的意思是：「<span class="text-indigo-600 font-bold">${target.meaningZH || '（無解釋）'}</span>」？`;

            let optionLabels = isQuestionTypeText
                ? optionsPool.map(o => `${o.meaningZH || '（無解釋）'}`)
                : optionsPool.map(o => `<span class="font-medium">${o.text}</span> ${o.jyutping ? `(${o.jyutping})` : ''}`);

            const hintText = `來源：${target.sourceBook} - ${target.sourceLesson}`;

            quizQuestions.push({
                question: questionText, options: optionLabels, correctIndex: correctAnswerIndex, hint: hintText, answered: false
            });
        });

        const quizContainer = document.getElementById('quiz-container');
        quizContainer.classList.remove('hidden');
        renderLocalQuizHTML();
        quizContainer.scrollIntoView({ behavior: 'smooth' });
    };

    // 3. 渲染測驗 HTML 面板
    function renderLocalQuizHTML() {
        const container = document.getElementById('quiz-content');
        let html = "";
        quizQuestions.forEach((q, qIdx) => {
            html += `
            <div id="q-block-${qIdx}" class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <div class="flex items-start gap-2">
                    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded mt-0.5">${qIdx + 1}</span>
                    <h3 class="text-gray-800 text-base md:text-lg mb-2">${q.question}</h3>
                </div>
                <p class="text-xs text-gray-400 mb-3 ml-7 flex items-center gap-1">📍 ${q.hint}</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 ml-7">`;
            
            q.options.forEach((opt, optIdx) => {
                html += `
                <button id="btn-${qIdx}-${optIdx}" onclick="checkLocalAnswer(${qIdx}, ${optIdx})" 
                        class="text-left px-4 py-3 bg-gray-50 hover:bg-indigo-50 border border-gray-200 rounded-xl text-sm transition-all focus:outline-none">
                    <span class="inline-block bg-white border border-gray-300 text-gray-500 rounded-md w-6 h-6 text-center leading-5 mr-2 font-bold text-xs">${String.fromCharCode(65 + optIdx)}</span>
                    ${opt}
                </button>`;
            });
            html += `</div></div>`;
        });
        
        html += `<div id="quiz-feedback-block" class="hidden mt-8 transition-all duration-500"></div>`;
        container.innerHTML = html;
    }

    // 4. 檢查學生的回答
    window.checkLocalAnswer = function(qIdx, selectedIdx) {
        const question = quizQuestions[qIdx];
        if (question.answered) return;
        question.answered = true;
        answeredQuestionsCount++; 

        const correctIdx = question.correctIndex;
        const block = document.getElementById(`q-block-${qIdx}`);
        
        question.options.forEach((_, optIdx) => {
            const btn = document.getElementById(`btn-${qIdx}-${optIdx}`);
            btn.disabled = true;
            btn.classList.remove('hover:bg-indigo-50');
            
            if (optIdx === correctIdx) {
                btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800', 'font-semibold');
                btn.querySelector('span').classList.add('bg-green-500', 'text-white', 'border-green-500');
            } else if (optIdx === selectedIdx) {
                btn.classList.add('bg-red-50', 'border-red-400', 'text-red-700', 'line-through');
                btn.querySelector('span').classList.add('bg-red-400', 'text-white', 'border-red-400');
            } else {
                btn.classList.add('opacity-40');
            }
        });

        if (selectedIdx === correctIdx) {
            correctCount++;
            document.getElementById('quiz-score').innerText = `得分：${correctCount} / ${quizQuestions.length}`;
            block.classList.add('border-green-200', 'bg-green-50/30');
        } else {
            block.classList.add('border-red-200', 'bg-red-50/30');
        }

        if (answeredQuestionsCount === quizQuestions.length) {
            showPositiveFeedback();
        }
    };

    // 5. 顯示結算報告
    function showPositiveFeedback() {
        const feedbackBlock = document.getElementById('quiz-feedback-block');
        const percentage = correctCount / quizQuestions.length;
        
        let emoji = "🌟"; let title = "測驗完成！"; let message = "";
        let bgColor = "from-green-50 to-emerald-100 border-green-200"; let textColor = "text-green-800";

        if (percentage === 1) {
            emoji = "🏆"; title = "完美滿分！太厲害了！"; message = "你對這些字詞已經倒背如流了，繼續保持這個完美的狀態！";
            bgColor = "from-yellow-50 to-orange-100 border-yellow-300"; textColor = "text-orange-800";
        } else if (percentage >= 0.8) {
            emoji = "🎉"; title = "做得非常好！"; message = "你的詞彙量非常豐富，只差一點點就完美了，真的很棒！";
        } else if (percentage >= 0.6) {
            emoji = "👍"; title = "表現不錯喔！"; message = "基礎很紮實！把這次答錯的題目多看幾遍，下次一定能拿高分！";
            bgColor = "from-blue-50 to-indigo-100 border-blue-200"; textColor = "text-blue-800";
        } else {
            emoji = "💪"; title = "繼續加油！"; message = "學習就是一個不斷進步的過程！別氣餒，針對不熟的課目再挑戰一次吧！";
            bgColor = "from-gray-50 to-gray-100 border-gray-300"; textColor = "text-gray-700";
        }

        feedbackBlock.className = `mt-8 p-8 rounded-2xl border-2 bg-gradient-to-br ${bgColor} shadow-lg text-center transform transition-all duration-500 ease-out`;
        feedbackBlock.innerHTML = `
            <div class="text-5xl mb-4 animate-bounce">${emoji}</div>
            <h2 class="text-2xl font-bold ${textColor} mb-2">${title}</h2>
            <p class="text-gray-700 text-lg mb-4">${message}</p>
            <div class="inline-block bg-white px-6 py-2 rounded-full font-bold text-xl shadow-sm ${textColor}">
                最終得分：${correctCount} / ${quizQuestions.length}
            </div>
            <div class="mt-6">
                <button onclick="openQuizSetup()" class="bg-white border-2 border-current text-current px-6 py-2 rounded-lg font-bold hover:opacity-80 transition-opacity">
                    🔄 再次設定範圍挑戰
                </button>
            </div>
        `;
        feedbackBlock.classList.remove('hidden');
        setTimeout(() => feedbackBlock.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
    }
</script>
